<body><header class="site-header hub-header"><a class="brand" href="./"><img src="assets/icon.svg" alt="" width="34" height="34">好奇心小站</a><nav class="hub-nav" aria-label="小站导航"><a href="./">今天学什么</a><a href="courses.html">全部课程</a><a href="records.html" aria-current="page">学习记录</a></nav></header><main class="records-main"><p class="eyebrow">每一次尝试，都有迹可循</p><h1>学习记录</h1><p class="records-intro">看看最初怎么想、哪里用过帮助，<br>再听听孩子自己的解释。</p><div class="records-note"><strong>边做边存，不用额外提交。</strong><p>记录保存在当前浏览器／桌面入口。家长可导出备份，换设备后导入恢复；孩子照常学习即可。录音不长期保存，记录不自动上传。</p></div><section class="backup-panel" aria-label="备份与换设备"><div class="backup-actions"><button class="primary" id="export-records">导出学习记录</button><button class="secondary" id="import-records">导入备份</button><input id="backup-file" type="file" accept=".json,application/json" hidden aria-label="选择学习记录备份"></div><p>导出全部课程为一个文件，直接发给 AI 分析，或存到「文件」留作备份。换 Mac 后，在同一小站点「导入备份」。</p><p class="backup-detail">重复记录会跳过；同一次练习有不同进度时分别保留。清理网站数据前请先导出，文件不含录音。</p><p id="backup-status" role="status" aria-live="polite"></p></section><div class="records-toolbar"><label for="course-filter">查看课程 <select id="course-filter"><option value="all">全部课程</option></select></label><span id="record-count" role="status"></span></div><div id="records-list"></div><p class="records-foot">展开一份记录即可截图。首答、提示与自评是分析线索，不等于已经长期掌握。旧版页面里未保存的记录无法补回。</p></main></body></html>

<script>/* Local learning evidence. Standalone lessons embed this same file. No network writes. */
(function (root) {
  'use strict';
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const prefix='curiosity-station:learning:v1:';
  const courses=[['daynight','太阳没关灯，为什么天黑了？','daynight.html'],['inertia','车停了，人为什么还往前？','inertia.html'],['purity','看起来一样，就是纯净物吗？','purity.html'],['math','圆，遇上正方形','lesson.html?topic=math'],['chinese','六年级语文 · 句式转换','lesson.html?topic=chinese'],['english','英语 · 机器狗，还是一只真狗？','english.html'],['scale','造一枚迷你火箭：比例尺到底怎么用？','scale.html'],['balance','9 个果子，只称 2 次？','balance.html'],['rocket','火箭为什么要回收？','rocket.html'],['charts','两张图都没造假，为什么结论相反？','charts.html'],['reading','这句话能证明你的答案吗？','reading.html'],['equation','神秘货箱有多重？','equation.html'],['speed','跑得远，就一定更快吗？','speed.html'],['map','地图转了，北方也会跟着转吗？','map.html'],['change','冒泡了，就一定发生化学变化吗？','change.html'],['tomato','一颗番茄，是组织还是器官？','tomato.html'],['now','平时常做，还是此刻正在做？','now.html'],['negative','零下8℃和零下3℃，哪里更暖？','negative.html'],['density','更重的积木，材料就更“密”吗？','density.html'],['contour','两条上山路，哪条更陡？','contour.html'],['cell','没有叶绿体，就不是植物细胞吗？','cell.html'],['subtract','减去负数，为什么反而变大？','subtract.html'],['past','昨天的试飞，怎么用英语讲清楚？','past.html'],['gist','一句话说清整件事','gist.html'],['particle','水蒸发了，分子也变大了吗？','particle.html'],['supplies','两瓶水，英语里究竟在数什么？','supplies.html'],['qualifier','一个“约”字，为什么不能随便删？','qualifier.html'],['power','3⁴是12吗？把乘方拆开看','power.html'],['division','细胞变多了，分工就会自动出现吗？','division.html'],['grid','只差一个字母，地点能跑到哪儿？','grid.html'],['forces','两个力一样大，就会互相抵消吗？','forces.html'],['multiply','负数乘负数，为什么是正数？','multiply.html']];
  const clone=value=>JSON.parse(JSON.stringify(value));
  const newId=()=>Date.now().toString(36)+'-'+(root.crypto?.randomUUID?.() || Math.random().toString(36).slice(2));
  let storageError=false;
  const bridged=!!root.__learningSeed;
  function valid(s) {return s?.version===1 && typeof s.id==='string' && /^[a-zA-Z0-9-]+$/.test(s.id) && typeof s.title==='string' && Array.isArray(s.records) && s.records.length===5 && s.records.every(r=>Array.isArray(r.attempts)&&Array.isArray(r.helps)&&Array.isArray(r.notes));}
  // Older cached registries recorded newly published lessons as 'other'.
  // Resolve only an exact known title; keep all learning evidence untouched.
  function resolveCourse(session) {
    const course=session?.courseId==='other' && courses.find(c=>c[1]===session.title);
    return course ? {...session,courseId:course[0]} : session;
  }
  function history() {
    if(bridged) return clone(root.__learningSeed.sessions || []).map(resolveCourse).sort((a,b)=>b.updatedAt-a.updatedAt);
    try {
      const result=[],storage=root.localStorage;
      if(!storage) return result;
      for(let i=0;i<storage.length;i++) {
        const key=storage.key(i);
        if(!key?.startsWith(prefix)) continue;
        try {const s=JSON.parse(storage.getItem(key));if(valid(s))result.push(resolveCourse(s));}catch(_) { /* Keep unreadable entries untouched. */ }
      }
      return result.sort((a,b)=>b.updatedAt-a.updatedAt);
    } catch(_) {storageError=true;return [];}
  }
  function announce(state) {
    if(!root.document) return;
    let box=root.document.getElementById('learning-save-status');
    if(!box) {box=root.document.createElement('p');box.id='learning-save-status';box.className='learning-save-status';box.setAttribute('role','status');root.document.body.append(box);}
    box.textContent=state==='saved'?'学习记录已自动保存在本机':state==='saving'?'正在保存本机记录…':'本机保存未成功，请先截图保留这次记录';
    box.dataset.state=state;
  }
  function write(session,remote=false) {
    if(bridged) {
      session.revision++;
      const sessions=root.__learningSeed.sessions;
      const index=sessions.findIndex(s=>s.id===session.id);
      if(index<0)sessions.push(clone(session));else sessions[index]=clone(session);
      announce('saving');
      root.parent.postMessage({type:'learning-save-v1',session:clone(session)},'*');
      return;
    }
    try {
      if(!root.localStorage) return;
      const stored=JSON.parse(root.localStorage.getItem(prefix+session.id)||'null');
      // A stale second tab gets a separate copy instead of overwriting newer work.
      if(remote && stored && stored.revision>=session.revision)throw new Error('Newer record exists');
      if(!remote && stored && stored.revision>session.revision) {session.id=newId();session.revision=0;}
      if(!remote)session.revision++;
      root.localStorage.setItem(prefix+session.id,JSON.stringify(session));
      storageError=false;if(!remote)announce('saved');
    } catch(_) {storageError=true;if(!remote)announce('failed');}
  }
  if(bridged) root.addEventListener('message',event=>{
    if(event.source===root.parent && event.data?.type==='learning-saved-v1') {storageError=!event.data.ok;announce(event.data.ok?'saved':'failed');}
  });
  function installMathBridge(frame) {
    root.addEventListener('message',event=>{
      const s=event.data?.session;
      if(event.source!==frame.contentWindow || event.data?.type!=='learning-save-v1' || !valid(s) || s.courseId!=='math' || JSON.stringify(s).length>2000000) return;
      write(s,true);
      event.source.postMessage({type:'learning-saved-v1',ok:!storageError},'*');
    });
  }
  function create(title, questions, fresh=false) {
    if (questions.length !== 5) throw new Error('A lesson has exactly five tasks');
    const existing=history();
    const saved=!fresh && existing.find(s=>s.title===title);
    const session=saved || {version:1,id:newId(),courseId:courses.find(c=>c[1]===title)?.[0]||'other',title,startedAt:Date.now(),updatedAt:Math.max(Date.now(),(existing[0]?.updatedAt||0)+1),revision:0,checkpoint:{},records:questions.map(q=>({title:q.title||q,context:[q.context,q.source,q.task].filter(Boolean).join(' '),first:null,attempts:[],helps:[],notes:[],done:false,self:'',draft:{}}))};
    const records=session.records;
    let active=!!saved;
    function save() {active=true;session.updatedAt=Math.max(Date.now(),session.updatedAt+1);if(records.every(r=>r.done)&&!session.completedAt)session.completedAt=Date.now();write(session);}
    function point(patch) {Object.assign(session.checkpoint,patch);save();}
    function draft(index,fields) {records[index].draft={...records[index].draft,...fields};save();}
    function help(index, label) {
      const r = records[index];
      const phase = r.done ? '完成后回看' : r.first ? '首答后' : '首答前';
      if (!r.helps.some(h => h.label === label && h.phase === phase)) r.helps.push({label, phase});
      save();
    }
    function submit(index, answer, correct = null, explanation = '') {
      const r = records[index];
      if (!String(answer).trim() || r.done) return false;
      const attempt = {answer:String(answer).trim(), correct, explanation:String(explanation).trim(), helped:r.helps.some(h=>h.phase !== '完成后回看')};
      r.attempts.push(attempt);
      if (!r.first) r.first = {...attempt};
      save();
      return true;
    }
    function note(index, text) {
      const notes = records[index].notes;
      if (text && notes[notes.length-1] !== text) notes.push(String(text));
      save();
    }
    function finish(index, self = '') { records[index].done = true; records[index].self = self; save(); }
    function status(r) {
      if (!r.first) return '未提交答案';
      if (r.first.correct === null) return '表达 / 自检，未自动判分';
      if (r.first.correct) return r.first.helped ? '首答正确，答前用过帮助' : '首答正确，答前未打开帮助';
      return r.attempts.some(a=>a.correct) ? '首答未通过，重试后通过' : '首答未通过，已查看方法或仍需帮助';
    }
    function html() {
      return `<section class="learning-report" aria-label="本次学习反馈"><h3>本次学习反馈 · ${records.filter(r=>r.done).length} / 5 题完成</h3><p class="report-course">${esc(title)}</p>${storageError?'<p class="report-status">本机保存未成功，请先截图保留这次记录。</p>':''}<p class="report-note">记录按作答过程保留，随时可以截图给家长；首答与求助记录帮助发现下一步，不等于已经长期掌握。</p><ol class="report-list">${records.map((r,i)=>{
        const first = r.first;
        const last = r.attempts[r.attempts.length-1];
        const laterExplanation = last?.explanation && last.explanation !== first?.explanation;
        return `<li><h4>${i+1}. ${esc(r.title)}</h4>${r.context?`<p class="report-context">${esc(r.context)}</p>`:''}<p class="report-status">${esc(status(r))}</p><p><b>首次答案：</b><span class="report-words">${esc(first?.answer || (r.done?'未提交，直接查看方法':'尚未提交'))}</span></p>${first?.explanation&&first.explanation!==first.answer?`<p><b>首次解释：</b><span class="report-words">${esc(first.explanation)}</span></p>`:''}${last && last !== first && r.attempts.length>1?`<p><b>最后提交：</b>${esc(last.answer)}</p>`:''}${laterExplanation?`<p><b>修改后解释：</b>${esc(last.explanation)}</p>`:''}<p><b>帮助：</b>${r.helps.length?r.helps.map(h=>`${esc(h.phase)}·${esc(h.label)}`).join('；'):'未打开提示或回看'}</p><p>有效提交 ${r.attempts.length} 次${r.self?`；自评：${esc(r.self)}`:''}。</p>${!r.done&&Object.entries(r.draft||{}).some(([k,v])=>typeof v==='string'&&v.trim()&&!k.startsWith('$'))?`<p><b>未提交草稿：</b><span class="report-words">${Object.entries(r.draft).filter(([k,v])=>typeof v==='string'&&v.trim()&&!k.startsWith('$')).map(([k,v])=>esc(v)).join('；')}</span></p>`:''}${r.notes.map(n=>`<p class="report-note">${esc(n)}</p>`).join('')}</li>`;
      }).join('')}</ol><p class="report-note">文字与操作记录自动保存在当前浏览器／桌面入口，不上传。纸上演算、外部求助无法自动识别；录音只在本次页面回听，不保存音频。</p></section>`;
    }
    return {records, help, submit, note, finish, html, save, point, draft, checkpoint:session.checkpoint, get active(){return active;}, get index(){const i=records.findIndex(r=>!r.done);return i<0?5:i;}};
  }
  function reasonField(label = '留一句自己的理由', placeholder = '一句话或一个算式就好，也可用键盘上的语音输入。') {
    return `<div class="evidence-reason"><label for="my-reason">${esc(label)}</label><textarea id="my-reason" maxlength="500" rows="2" placeholder="${esc(placeholder)}"></textarea><label class="reason-unsure"><input type="checkbox" id="reason-unsure">我暂时说不清，先记下来</label><p class="report-note">这是本题的一部分，不另加题；先留自己的想法，再看参考。</p></div>`;
  }
  function readReason(container) {
    const input = container.querySelector('#my-reason');
    return input?.value.trim() || (container.querySelector('#reason-unsure')?.checked ? '暂时说不清' : null);
  }
  const bindings=new WeakMap();
  function watchDraft(container,log,index) {
    const previous=bindings.get(container);
    if(previous) for(const type of ['input','change','click'])container.removeEventListener(type,previous,true);
    const fields=log.records[index].draft || {};
    container.querySelectorAll('input,textarea,select').forEach(el=>{
      const key=el.type==='radio'?'$radio:'+el.name:el.id;
      if(!key || !(key in fields))return;
      if(el.type==='radio')el.checked=el.value===fields[key];
      else if(el.type==='checkbox')el.checked=fields[key];else el.value=fields[key];
    });
    container.querySelectorAll('[data-answer],[data-choice]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.answer??el.dataset.choice)===fields.$choice)));
    const listener=event=>{
      const el=event.target;
      if(event.type==='click') {
        const button=el.closest('[data-answer],[data-choice]');
        if(button&&!button.disabled)log.draft(index,{$choice:Number(button.dataset.answer??button.dataset.choice)});
      } else if(el.matches('input,textarea,select')&&!el.disabled) {
        const key=el.type==='radio'?'$radio:'+el.name:el.id;
        if(key)log.draft(index,{[key]:el.type==='checkbox'?el.checked:el.value});
      }
    };
    for(const type of ['input','change','click'])container.addEventListener(type,listener,true);
    bindings.set(container,listener);
  }
  function watchHelp(container, log, index) {
    watchDraft(container,log,index);
    container.querySelectorAll('details[data-help]').forEach(details=>details.addEventListener('toggle',()=>{if(details.open) log.help(index,details.dataset.help);}));
  }
  root.LearningFeedback = {create, esc, reasonField, readReason, watchHelp, watchDraft, history, courses, resolveCourse, installMathBridge, get storageError(){return storageError;}};
  if (typeof module !== 'undefined' && module.exports) module.exports = root.LearningFeedback;
})(typeof window !== 'undefined' ? window : globalThis);</script>

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

.form-control:focus-visible {

}

.form-control:disabled,

}

.form-select {

  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));

  border-radius: var(--radius-full);
  corner-shape: var(--corner-shape);

  background-image:
    linear-gradient(
      45deg,

      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    );
  background-position:
    calc(100% - 12px - var(--icon-size) / 2) 50%,
    calc(100% - 12px - var(--icon-size) * 0.18) 50%;

  background-size: calc(var(--icon-size) * 0.32) calc(var(--icon-size) * 0.32);
  cursor: var(--cursor-interaction, default);

.form-select option {

.form-select:not(:disabled):hover {

    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)

.form-select:focus-visible {

.form-check-input {

  height: 14px;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

  box-shadow: var(--shadow-sm);
  position: relative;

  height: calc(10px + var(--control-spacing, 12px) / 2);
  border-color: var(--border-strong, var(--input));
  border-radius: calc(var(--radius-sm) / 2);
  background-color: transparent;
  color: var(--foreground);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:is(:checked, :indeterminate) {

.form-check:not(.form-switch)

  height: 100%;

  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
  background-color: var(--foreground);
}
.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:indeterminate::before {
  position: absolute;
  inset: 0;
  display: block;
  width: 65%;
  height: 6.65%;
  margin: auto;
  border-radius: var(--radius-full);
  background: var(--foreground);
  mask: none;
  content: &quot;&quot;;
}

.form-check-input[type=&quot;radio&quot;] {

  width: 16px;
  height: 16px;
  border: 0;

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:focus-visible {

.form-check:not(.form-switch) .form-check-input:disabled {

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

.form-check:not(.form-switch) .form-check-input[type=&quot;radio&quot;]:disabled,
.form-check:not(.form-switch)
  .form-check-input[type=&quot;radio&quot;]:disabled
  + .form-check-label {

}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {

.form-switch .form-check-input {

  height: 20px;

.form-switch .form-check-input::before {

  border-color: #fff;
  background: #fff;
}

.form-switch .form-check-input:checked {
  background: var(--blue);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

}

.form-range {

  display: block;

  padding: 0;

/* Web recipes are the default, including on renderers without inline style queries. */
@supports (border-radius: if(style(--corner-shape: round): 1px; else: 2px)) {
  /* Match the host&#x27;s proportional text-sm scale at every text preference. */
  .tooltip,
  .viz-badge,
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    font-size: if(
      style(--corner-shape: round): round(

          calc(var(--font-size-base) * 14 / 16),
          1px
        );
        else: round(nearest, calc(var(--font-size-base) * 13 / 14), 1px)
    );
  }

  .btn,
  .nav-link,
  .form-select {
    border-radius: if(
      style(--corner-shape: round): var(--radius-full); else: var(--radius-lg)
    );
  }

  .form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
    border-radius: if(
      style(--corner-shape: round): calc(var(--radius-sm) / 2);
        else: calc(var(--radius-lg) * 0.4)
    );
  }

  .tooltip {
    font-weight: if(
      style(--corner-shape: round): 600; else: var(--font-weight-normal)
    );
  }
}

  .form-check-input {

(() =&gt; {

  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);

      return;

      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??

        &lt;summary class=&quot;cursor-interaction&quot;&gt;
          &lt;span class=&quot;viz-carousel-count tabular-nums&quot;&gt;&lt;/span&gt;
          &lt;span class=&quot;viz-carousel-name&quot;&gt;&lt;/span&gt;
          &lt;svg class=&quot;viz-carousel-caret&quot; width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 20 21&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot; focusable=&quot;false&quot;&gt;
            &lt;path d=&quot;M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z&quot; fill=&quot;currentColor&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;0.6&quot; /&gt;
          &lt;/svg&gt;
        &lt;/summary&gt;
        &lt;div class=&quot;viz-carousel-options&quot;&gt;&lt;/div&gt;
      &lt;/details&gt;
      &lt;button type=&quot;button&quot; class=&quot;viz-carousel-next cursor-interaction&quot;&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;`;
      const previous = controls.querySelector(&quot;.viz-carousel-previous&quot;);
      const next = controls.querySelector(&quot;.viz-carousel-next&quot;);
      const picker = controls.querySelector(&quot;.viz-carousel-picker&quot;);
      const summary = picker.querySelector(&quot;summary&quot;);
      const count = controls.querySelector(&quot;.viz-carousel-count&quot;);
      const name = controls.querySelector(&quot;.viz-carousel-name&quot;);
      const options = controls.querySelector(&quot;.viz-carousel-options&quot;);
      const status = document.createElement(&quot;span&quot;);
      status.className = &quot;sr-only&quot;;
      status.setAttribute(&quot;role&quot;, &quot;status&quot;);
      status.setAttribute(&quot;aria-live&quot;, &quot;polite&quot;);
      status.setAttribute(&quot;aria-atomic&quot;, &quot;true&quot;);
      previous.setAttribute(
        &quot;aria-label&quot;,
        root.dataset.previousLabel ?? &quot;Previous variant&quot;,
      );
      next.setAttribute(&quot;aria-label&quot;, root.dataset.nextLabel ?? &quot;Next variant&quot;);

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
        summaryPointerHandled =
          event.pointerType === &quot;mouse&quot; &amp;&amp; event.button === 0 &amp;&amp; !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener(&quot;click&quot;, (event) =&gt; {
        if (summaryPointerHandled &amp;&amp; event.detail &gt; 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) =&gt; {
        const choice = document.createElement(&quot;button&quot;);
        choice.type = &quot;button&quot;;
        choice.className = &quot;cursor-interaction&quot;;
        choice.textContent = panel.dataset.variant;
        choice.addEventListener(&quot;click&quot;, () =&gt; {
          select(index);
          summary.focus();
        });
        choice.addEventListener(&quot;pointerup&quot;, (event) =&gt; {
          if (
            picker.open &amp;&amp;
            event.pointerType === &quot;mouse&quot; &amp;&amp;
            event.button === 0 &amp;&amp;
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) =&gt; {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) =&gt; {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            &quot;aria-current&quot;,
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener(&quot;click&quot;, () =&gt;
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener(&quot;click&quot;, () =&gt;
        select((active + 1) % panels.length),
      );
      picker.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key === &quot;Escape&quot; &amp;&amp; picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === &quot;ArrowDown&quot;) {
          nextIndex = index &lt; 0 ? active : (index + 1) % choices.length;
        } else if (event.key === &quot;ArrowUp&quot;) {
          nextIndex = index &lt; 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open &amp;&amp; event.key === &quot;Home&quot;) {
          nextIndex = 0;
        } else if (picker.open &amp;&amp; event.key === &quot;End&quot;) {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener(&quot;focusout&quot;, (event) =&gt; {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) =&gt; {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () =&gt; {
        mousePointerId = null;
      };
      const sizePicker = () =&gt; {
        root.style.setProperty(
          &quot;--viz-carousel-picker-height&quot;,
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener(&quot;toggle&quot;, sizePicker);
      window.addEventListener(&quot;resize&quot;, sizePicker);
      document.addEventListener(&quot;pointerdown&quot;, dismiss);
      document.addEventListener(&quot;pointerup&quot;, endPointerSelection);
      document.addEventListener(&quot;pointercancel&quot;, endPointerSelection);
      window.addEventListener(&quot;blur&quot;, endPointerSelection);
      window.addEventListener(
        &quot;pagehide&quot;,
        () =&gt; {
          document.removeEventListener(&quot;pointerdown&quot;, dismiss);
          document.removeEventListener(&quot;pointerup&quot;, endPointerSelection);
          document.removeEventListener(&quot;pointercancel&quot;, endPointerSelection);
          window.removeEventListener(&quot;blur&quot;, endPointerSelection);
          window.removeEventListener(&quot;resize&quot;, sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
&lt;/script&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  let frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  LearningFeedback.installMathBridge(frame);
  const learningSeed={sessions:LearningFeedback.history().filter(s=>s.courseId==='math')};
  frameHtml=frameHtml.replace('<head>','<head><script>window.__learningSeed='+JSON.stringify(learningSeed).replace(/</g,'\\u003c')+';<\/script>');
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
